name: Auto-Sync zoh.m3u

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tag Based Sync Script
        run: |
          python << 'EOF'
          import requests
          import re
          import os

          # Updated settings
          FILE_NAME = "Zoh.m3u"
          SOURCE_URL = "https://clarity-tv.vercel.app/api/playlist/?id=ALLINONE"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def get_all_blocks(content):
              # Extracts blocks starting with #KODIPROP or #EXTINF
              return re.findall(r'((?:#KODIPROP:.*?|#EXTINF:.*?)\n(?:^[^#].*$\n?)*)', content, re.MULTILINE)

          def get_channel_id(block):
              # Using tvg-id for accurate matching
              match = re.search(r'tvg-id="([^"]+)"', block)
              return match.group(1) if match else None

          try:
              response = requests.get(SOURCE_URL, headers=HEADERS, timeout=30)
              response.raise_for_status()
              source_blocks = get_all_blocks(response.text)
              
              # Map source channels by their ID
              source_dict = {get_channel_id(sb): sb.strip() for sb in source_blocks if get_channel_id(sb)}

              if not os.path.exists(FILE_NAME):
                  print(f"Error: {FILE_NAME} not found")
                  exit(1)

              with open(FILE_NAME, "r", encoding="utf-8") as f:
                  current_playlist = f.read()

              my_blocks = get_all_blocks(current_playlist)
              new_playlist = current_playlist

              for mb in my_blocks:
                  # STRICT RULE: Only update if "jiotv" tag exists in the block
                  if "jiotv" in mb.lower():
                      cid = get_channel_id(mb)
                      if cid in source_dict:
                          # Replaces the entire block with updated data from source
                          new_playlist = new_playlist.replace(mb.strip(), source_dict[cid])
                          print(f"Updated: {cid}")

              with open(FILE_NAME, "w", encoding="utf-8") as f:
                  f.write(new_playlist)

          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync JioTV channels from clarity-tv"
            git push
          else
            echo "No changes detected."
          fi
