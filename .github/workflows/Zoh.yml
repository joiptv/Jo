name: Auto-Sync JioTV Only

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tag Based Sync Script
        run: |
          python << 'EOF'
          import requests
          import re
          import os

          # ഫയൽ പേര് ശ്രദ്ധിക്കുക (Zoh.m3u അല്ലെങ്കിൽ Zoh.txt)
          FILE_NAME = "Zoh.m3u" 
          SOURCE_URL = "https://allinonereborn.online/jiotv-m3u/playlist009.m3u8"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def get_all_blocks(content):
              # Blocks identify regex
              return re.findall(r'(#EXTINF:.*?(?:\n#KODIPROP:.*)*\n(?:http|https)://\S+)', content, re.DOTALL)

          def get_channel_id(block):
              match = re.search(r'tvg-id="([^"]+)"', block)
              return match.group(1) if match else None

          try:
              print("Fetching source playlist...")
              response = requests.get(SOURCE_URL, headers=HEADERS, timeout=30)
              response.raise_for_status()
              source_blocks = get_all_blocks(response.text)
              source_dict = {get_channel_id(sb): sb.strip() for sb in source_blocks if get_channel_id(sb)}

              if not os.path.exists(FILE_NAME):
                  print(f"Error: {FILE_NAME} not found in repository!")
                  exit(1)

              with open(FILE_NAME, "r", encoding="utf-8") as f:
                  current_playlist = f.read()

              my_blocks = get_all_blocks(current_playlist)
              new_playlist = current_playlist

              changes_made = False
              for mb in my_blocks:
                  # JioTV ടാഗ് ഉള്ളവ മാത്രം നോക്കുന്നു
                  if "jiotv" in mb.lower():
                      cid = get_channel_id(mb)
                      if cid in source_dict:
                          original_block = mb.strip()
                          new_block = source_dict[cid]
                          if original_block != new_block:
                              new_playlist = new_playlist.replace(original_block, new_block)
                              changes_made = True

              if changes_made:
                  with open(FILE_NAME, "w", encoding="utf-8") as f:
                      f.write(new_playlist)
                  print("Playlist updated successfully.")
              else:
                  print("No changes needed.")

          except Exception as e:
              print(f"An error occurred: {e}")
              exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync JioTV tagged blocks"
            git push
          else
            echo "No changes to commit"
          fi
