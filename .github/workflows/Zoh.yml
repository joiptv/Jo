name: Auto-Update JioTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto Sync Script
        run: |
          python << 'EOF'
          import requests
          import re
          import os

          FILE_NAME = "Zoh.txt" 
          SOURCE_URL = "https://netx.streamstar18.workers.dev/zio1"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def get_all_blocks(content):
              # Extracts the entire block starting from #KODIPROP or #EXTINF until the next #EXTINF or end of file
              return re.findall(r'((?:#KODIPROP:.*?|#EXTINF:.*?)\n(?:^[^#].*$\n?)*)', content, re.MULTILINE)

          def get_name(block):
              match = re.search(r'#EXTINF:.*?,(.*)', block)
              return match.group(1).strip() if match else None

          try:
              response = requests.get(SOURCE_URL, headers=HEADERS, timeout=30)
              response.raise_for_status()
              source_content = response.text
              
              source_blocks = get_all_blocks(source_content)
              # Create a dictionary where the key is the channel name and the value is the FULL block (KODI props + Link)
              source_dict = {get_name(sb): sb.strip() for sb in source_blocks if get_name(sb)}

              if not os.path.exists(FILE_NAME):
                  print(f"Error: {FILE_NAME} not found")
                  exit(1)

              with open(FILE_NAME, "r", encoding="utf-8") as f:
                  my_playlist = f.read()

              my_blocks = get_all_blocks(my_playlist)
              updated_playlist = my_playlist

              for mb in my_blocks:
                  # Check if the block contains "jiotv" tag anywhere (Logo URL, ID, or Title)
                  if "jiotv" in mb.lower():
                      name = get_name(mb)
                      if name in source_dict:
                          # Replaces the entire old block with the entire new block (Kodi Props + Link)
                          updated_playlist = updated_playlist.replace(mb.strip(), source_dict[name])
                          print(f"Full Update: {name}")

              with open(FILE_NAME, "w", encoding="utf-8") as f:
                  f.write(updated_playlist)

          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync full JioTV blocks including Kodi Props"
            git push
          else
            echo "No changes detected"
          fi
