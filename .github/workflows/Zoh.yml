name: Auto-Sync JioTV Only

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tag Based Sync Script
        run: |
          python << 'EOF'
          import requests
          import re
          import os

          FILE_NAME = "Zoh.txt"
          SOURCE_URL = "https://jp.techparag.xyz/playlist.m3u"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def get_all_blocks(content):
              return re.findall(r'((?:#KODIPROP:.*?|#EXTINF:.*?)\n(?:^[^#].*$\n?)*)', content, re.MULTILINE)

          def get_channel_id(block):
              match = re.search(r'tvg-id="([^"]+)"', block)
              return match.group(1) if match else None

          try:
              response = requests.get(SOURCE_URL, headers=HEADERS, timeout=30)
              response.raise_for_status()
              source_blocks = get_all_blocks(response.text)
              source_dict = {get_channel_id(sb): sb.strip() for sb in source_blocks if get_channel_id(sb)}

              if not os.path.exists(FILE_NAME):
                  exit(1)

              with open(FILE_NAME, "r", encoding="utf-8") as f:
                  current_playlist = f.read()

              my_blocks = get_all_blocks(current_playlist)
              new_playlist = current_playlist

              for mb in my_blocks:
                  # Focus strictly on the "JioTV" tag
                  if "jiotv" in mb.lower():
                      cid = get_channel_id(mb)
                      if cid in source_dict:
                          new_playlist = new_playlist.replace(mb.strip(), source_dict[cid])

              with open(FILE_NAME, "w", encoding="utf-8") as f:
                  f.write(new_playlist)

          except Exception as e:
              exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync JioTV tagged blocks"
            git push
          fi
