name: Extract Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Playlist Links
        run: |
          # Fetch page source and extract stream URLs directly into Zoh.txt
          curl -sL "https://jalworldiptv.vercel.app" | \
          grep -Eo 'https?://[^"'\'' ]+\.(m3u8|mpd|ts|mkv)(\?[^"'\'' ]*)?' | \
          sort -u > Zoh.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add Zoh.txt
          
          if git diff --staged --quiet; then
            echo "No new playlist links found."
          else
            git commit -m "chore: update Zoh.txt with extracted links"
            git pull --rebase origin main
            git push origin main
          fi
