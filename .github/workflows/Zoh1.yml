name: Extract Full M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract M3U Playlist File
        run: |
          # 1. Download webpage source
          curl -sL "https://jalworldiptv.vercel.app" -o raw_source.html

          # 2. Extract only the lines belonging to the playlist structure
          grep -E '^ *(#EXTM3U|#EXTINF|#EXTVLCOPT|#KODIPROP|#EXTHTTP|https?://)' raw_source.html \
            | sed -e 's/^[ \t]*//' \
            > playlist.m3u

          # Clean temporary file
          rm -f raw_source.html

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add playlist.m3u
          
          if git diff --staged --quiet; then
            echo "No changes found in playlist."
          else
            git commit -m "chore: update playlist.m3u with extracted channels"
            git pull --rebase origin main
            git push origin main
          fi
