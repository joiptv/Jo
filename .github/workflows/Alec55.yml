name: Update viva.m3u Playlist

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual run from Actions tab
  push:
    paths:
      - '.github/workflows/update_viva.yml'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download, Filter, and Generate viva.m3u
        run: |
          python - << 'EOF'
          import urllib.request

          SOURCE_URL = "https://raw.githubusercontent.com/joiptv/Jo/refs/heads/main/Alex55.m3u"
          OUTPUT_FILE = "viva.m3u"
          FILTER_TAGS = ["jiotv"]

          def fetch_playlist(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8", errors="ignore")

          def process_playlist(raw_content):
              lines = raw_content.splitlines()
              matching_entries = []
              current_entry_lines = []

              for line in lines:
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#EXTM3U"):
                      continue

                  if stripped.startswith("#EXTINF:"):
                      current_entry_lines = [stripped]
                  elif current_entry_lines:
                      current_entry_lines.append(stripped)
                      # When a line does not start with '#', it represents the stream URL
                      if not stripped.startswith("#"):
                          entry_text = "\n".join(current_entry_lines)
                          entry_lower = entry_text.lower()

                          if any(tag in entry_lower for tag in FILTER_TAGS):
                              matching_entries.append(entry_text)

                          current_entry_lines = []

              return matching_entries

          def main():
              print("Fetching source playlist...")
              content = fetch_playlist(SOURCE_URL)
              
              print("Filtering matching channels...")
              matches = process_playlist(content)
              print(f"Extracted {len(matches)} channels.")

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  for entry in matches:
                      f.write(entry + "\n")
              
              print(f"Generated {OUTPUT_FILE} successfully.")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add viva.m3u
          if git diff --staged --quiet; then
            echo "No changes detected in viva.m3u."
          else
            git commit -m "Auto-update viva.m3u [skip ci]"
            git push
          fi
