name: Update Malayalam M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download M3U Playlist
        run: |
          # Download the raw playlist directly from iptv-org
          curl -sL "https://iptv-org.github.io/iptv/languages/mal.m3u" -o mal.m3u

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add mal.m3u
          
          if git diff --staged --quiet; then
            echo "No changes found in playlist."
          else
            git commit -m "chore: update mal.m3u playlist"
            git pull --rebase origin main
            git push origin main
          fi
