name: Auto Play Link and Update Zoh.txt

on:
  schedule:
    # ഓരോ 30 മിനിറ്റിലും ഓട്ടോമാറ്റിക് ആയി റൺ ചെയ്യും
    - cron: '*/30 * * * *'
  workflow_dispatch: # നിങ്ങൾക്ക് ആവശ്യമുള്ളപ്പോൾ മാനുവൽ ആയി റൺ ചെയ്യാം

jobs:
  play_and_update:
    runs-on: ubuntu-latest

    steps:
    # 1. നിങ്ങളുടെ റെപ്പോസിറ്ററി ചെക്കൗട്ട് ചെയ്യുന്നു
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. m3u8 ലിങ്ക് ഓട്ടോമാറ്റിക് ആയി പ്ലേ ചെയ്യുന്നു (Activation Trigger)
    - name: Auto Play Activation Link
      run: |
        curl -sL "https://activation-07live.pages.dev/activate.m3u8" -o /dev/null
        wget -qO- "https://activation-07live.pages.dev/activate.m3u8" > /dev/null
        echo "ആക്ടിവേഷൻ ലിങ്ക് വിജയകരമായി ബാക്ക്ഗ്രൗണ്ടിൽ പ്ലേ ചെയ്തു."

    # 3. ഒറിജിനൽ സോഴ്സിൽ നിന്ന് പുതിയ ചാനൽ ഡാറ്റ ഫെച്ച് ചെയ്യുന്നു
    - name: Fetch Latest Data from Ser.m3u
      run: |
        curl -sL "https://raw.githubusercontent.com/joiptv/jojo/refs/heads/main/Ser.m3u" -o temp_Zoh.txt

    # 4. പുതിയ ഡാറ്റ Zoh.txt ഫയലിലേക്ക് മാറ്റി പുഷ് ചെയ്യുന്നു
    - name: Commit and Push Changes to Zoh.txt
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # ഫയൽ കാലിയല്ലെന്ന് ഉറപ്പ് വരുത്തുന്നു
        if [ -s temp_Zoh.txt ]; then
          mv temp_Zoh.txt Zoh.txt
          git add Zoh.txt
          
          if git diff --staged --quiet; then
            echo "ചാനൽ ലിസ്റ്റിൽ മാറ്റങ്ങൾ ഒന്നുമില്ല."
          else
            git commit -m "Auto Played & Updated Zoh.txt: $(date)"
            git push
          fi
        else
          echo "Error: സോഴ്സ് ഫയൽ കാലിയാണ്. അപ്ഡേറ്റ് ചെയ്യുന്നില്ല."
          exit 1
        fi
